
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(#333333, #c8c8c8);
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #formContainer {
            width: 480px;
            max-width: 100%;
            background: #f3f8ed;
            border: 12px solid #3268b8;
            border-radius: 30px;
            overflow: hidden;
        }

        .hero {
            height: 205px;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            text-shadow: 2px 3px 4px black;
        }

        .hero h1 {
            font-size: 42px;
            margin: 0;
        }

        .hero p {
            font-size: 29px;
            margin: 0;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }

        h3 {
            text-align: center;
            font-size: 21px;
            margin: 20px 10px;
        }

        form {
            padding: 0 20px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 12px;
            align-items: center;
        }

        form > label {
            font-size: 16px;
        }

        form > input {
            width: 100%;
            height: 27px;
            border: 1px solid #aaa;
        }

        .gender {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .checkrow {
            grid-column: 1 / 3;
            text-align: center;
        }

        .submitrow {
            grid-column: 1 / 3;
            text-align: center;
        }

        button[type="submit"] {
            padding: 5px 15px;
            cursor: pointer;
        }

        .scriptures {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            height: 105px;
            gap: 3px;
            background: #f3f8ed;
        }

        .scriptures img {
            width: 100%;
            height: 105px;
            object-fit: fill;
        }

        #output {
            color: white;
            padding: 15px;
        }

        @media (max-width: 450px) {
            form {
                grid-template-columns: 1fr;
            }

            .checkrow, .submitrow {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>
    <div>
        <div id="formContainer">
            <div class="hero">
                <button type="button" id="closeBtn">X</button>
                <h1>Daily Feed</h1>
                <p>Scripture a Day</p>
            </div>

            <h3>Sign Up for Daily Scripture Feed</h3>

            <form id="myForm">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label>Gender:</label>
                <div class="gender">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>

                <section class="checkrow">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section class="checkrow">
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </section>

                <section class="submitrow">
                    <button type="submit">Submit</button>
                </section>
            </form>

            <div class="scriptures">
                <img src="images/old_testament.webp" alt="Old Testament">
                <img src="images/new_testament.webp" alt="New Testament">
                <img src="images/book_of_mormon.webp" alt="Book of Mormon">
                <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
                <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
            </div>
        </div>

        <div id="output"></div>
    </div>

    <script>
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById("myForm");
        const output = document.getElementById("output");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                const item = document.createElement("li");
                const strong = document.createElement("strong");
                strong.textContent = key + ": ";
                item.appendChild(strong);
                item.appendChild(document.createTextNode(
                    key === "password" ? "[hidden for security]" : value
                ));
                entries.push(item);
            }

            output.replaceChildren();
            const heading = document.createElement("h3");
            heading.textContent = "Here is the data that would be sent to the server:";
            const list = document.createElement("ul");
            entries.forEach(item => list.appendChild(item));
            output.append(heading, list);
        });
    </script>
</body>
</html>
