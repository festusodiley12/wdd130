
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>

    <main>
      <div class="content-box">
        <h2>My Favorite BYU-I Devotionals</h2>

        <table>
          <thead>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>David A. Bednar</td>
              <td>The Character of Christ</td>
              <td>BYU-Idaho</td>
              <td>2003</td>
            </tr>
            <tr>
              <td>Jeffrey R. Holland</td>
              <td>Remember Lot's Wife</td>
              <td>BYU</td>
              <td>2009</td>
            </tr>
            <tr>
              <td>Dieter F. Uchtdorf</td>
              <td>Forget Me Not</td>
              <td>General Relief Society Meeting</td>
              <td>2011</td>
            </tr>
          </tbody>
        </table>

        <h2>Add a Devotional</h2>

        <form>
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" name="speaker" required>

          <label for="title">Title:</label>
          <input type="text" id="title" name="title" required>

          <label for="location">Location:</label>
          <input type="text" id="location" name="location" required>

          <label for="year">Year:</label>
          <input type="number" id="year" name="year" required>

          <button type="submit">Add Devotional</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
